[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bmqa"
version = "0.1.0"
description = "Reducing hallucination in biomedical question answering (PubMedQA) with retrieval-augmented generation."
readme = "README.md"
requires-python = ">=3.11"
# Runtime dependencies are added by the phase that first needs them, never ahead of time.
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # Pinned to a minor series: new ruff releases add rules and could fail CI unexpectedly.
    "ruff>=0.17,<0.18",
]
# Phase 1: fine-tuning the biomedical classifier (GPU recommended; never installed in CI).
classifier = [
    "torch>=2.2",
    "transformers>=4.40",
    "numpy>=1.26",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
