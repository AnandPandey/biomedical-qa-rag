[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bmqa"
version = "0.1.0"
description = "Reducing hallucination in biomedical question answering (PubMedQA) with retrieval-augmented generation."
readme = "README.md"
requires-python = ">=3.11"
# Runtime dependencies are added by the phase that first needs them, never ahead of time.
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # Pinned to a minor series: new ruff releases add rules and could fail CI unexpectedly.
    "ruff>=0.17,<0.18",
]
# Phase 1: fine-tuning the biomedical classifier (GPU recommended; never installed in CI).
classifier = [
    "torch>=2.2",
    "transformers>=4.40",
    "numpy>=1.26",
]
# Phase 2: LLM providers and utilities (never installed in CI; tests use a fake client or mocks).
llm = [
    "anthropic>=2.12",
    "python-dotenv>=1.0",
    "torch>=2.2",
    "transformers>=4.40",
    "accelerate>=0.28",
    "bitsandbytes>=0.43",
]
# Phase 3: building the retrieval corpus from Hugging Face (not installed in CI).
corpus = [
    "datasets>=2.19",
]
# Phase 3: BM25 retrieval (light; installed in CI so the retriever tests run).
retrieval = [
    "bm25s>=0.3",
    "PyStemmer>=3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
